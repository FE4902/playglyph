<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Compare Board</title>
<style>
  :root { --bg: #14161d; --panel: #1c1f29; --line: #2b2f3d; --text: #e7e9f0; --muted: #8b90a3; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 13px/1.4 system-ui, sans-serif; padding: 16px; }
  h2 { font-size: 14px; margin: 18px 0 8px; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: stretch; }
  .cell { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px; display: flex; flex-direction: column; align-items: center; gap: 6px; min-width: 120px; }
  .cell.light { background: #eef0f4; color: #333; }
  .cell .lab { font-size: 11px; color: var(--muted); }
  .sizes { display: flex; gap: 8px; align-items: flex-end; }
  .ref { width: 96px; height: 96px; background-repeat: no-repeat; border-radius: 6px; }
  svg { overflow: visible; }
</style>
</head>
<body>
<div id="out"></div>
<script type="module">
  // Reference crops (RhosGFX Vector Icon Pack preview, viewed only, not stored)
  const RHOS = 'https://img.itch.zone/aW1hZ2UvMTQ2Mzc3NC8zMDgwNTc3Ny5wbmc=/original/WDbNRK.png';
  const crops = { settings: [17, 633, 170], coin: [1205, 838, 150], heart: [481, 329, 390] };
  const names = (new URLSearchParams(location.search).get('icons') ?? 'settings,coin,heart').split(',');
  const load = async (p) => { const r = await fetch(p + '?t=' + Date.now()); return r.ok ? r.text() : null; };
  const sized = (svg, s) => svg.replace(/width="24" height="24"/, `width="${s}" height="${s}"`);
  const sizes = (svg, color) => `<div class="sizes" style="color:${color}">${[96, 48, 24].map((s) => sized(svg, s)).join('')}</div>`;
  let html = '';
  for (const n of names) {
    const [x, y, w] = crops[n] ?? [];
    const ref = x != null ? `<div class="cell"><div class="ref" style="background-image:url(${RHOS});background-size:${1350 * 96 / w}px auto;background-position:-${x * 96 / w}px -${y * 96 / w}px"></div><span class="lab">레퍼런스 (RhosGFX)</span></div>` : '';
    html += `<h2>${n}</h2><div class="row">${ref}`;
    for (const [tag, base] of [['이전', 'before/'], ['새', '../icons/']]) {
      const fi = await load(base + 'filled/' + n + '.svg'), st = await load(base + 'sticker/' + n + '.svg');
      if (fi) html += `<div class="cell">${sizes(fi, '#e7e9f0')}<span class="lab">${tag} · 채운 단색</span></div><div class="cell light">${sizes(fi, '#2a2d38')}<span class="lab">${tag} · 밝은 배경</span></div>`;
      if (st) html += `<div class="cell">${sizes(st)}<span class="lab">${tag} · 스티커</span></div><div class="cell light">${sizes(st)}<span class="lab">${tag} · 밝은 배경</span></div>`;
    }
    html += '</div>';
  }
  document.getElementById('out').innerHTML = html;
</script>
</body>
</html>
