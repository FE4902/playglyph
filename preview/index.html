<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>아이콘 — Playglyph</title>
<meta name="description" content="Playglyph 아이콘 134종을 이름, 별칭, 한글로 찾고 SVG나 코드로 복사합니다." />
<link rel="icon" href="../site/favicon.svg" type="image/svg+xml" />
<script src="../site/i18n.js"></script>
<script>try { if (localStorage.getItem('pg-theme') === 'light') document.documentElement.dataset.theme = 'light'; } catch (e) {}</script>
<link rel="stylesheet" href="../site/main.css" />
<style>
  /* Gallery layout. Header, color tokens, .seg and .toast come from site/main.css. Spacing sits on a 4px grid. */
  .g-shell { max-width: 1440px; margin: 0 auto; padding: 0 clamp(16px, 3vw, 32px); display: grid; grid-template-columns: 232px minmax(0, 1fr); gap: 32px; }
  .g-side { position: sticky; top: 61px; align-self: start; max-height: calc(100vh - 61px); overflow-y: auto; padding: 24px 0 32px; display: grid; gap: 24px; }
  .g-group h2 { margin: 0 0 8px; font-size: 13px; font-weight: 600; color: var(--muted); }
  .g-group h2 output { color: var(--text); font-weight: 400; font-variant-numeric: tabular-nums; }
  .g-side .seg { display: flex; }
  .g-side .seg button { flex: 1; }
  .g-mats { display: grid; grid-template-columns: repeat(6, 28px); gap: 4px; }
  .g-mat { width: 28px; height: 28px; padding: 0; border: 1px solid transparent; border-radius: 8px; background: none; display: grid; place-items: center; }
  .g-mat i { width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--o); background: var(--c); }
  .g-mat.none i { border: 1px dashed var(--muted); background: none; }
  .g-mat:hover { background: var(--panel-2); }
  .g-mat[aria-pressed="true"] { border-color: var(--line); background: var(--panel-2); }
  .g-range { width: 100%; margin: 4px 0 0; accent-color: var(--text); }
  .g-cats { display: grid; gap: 2px; }
  .g-cat { display: flex; align-items: center; justify-content: space-between; height: 32px; padding: 0 8px; border: 0; border-radius: 8px; background: none; color: var(--muted); font-size: 14px; text-align: left; transition: background-color .12s, color .12s; }
  .g-cat span { font: 12px ui-monospace, "SF Mono", Menlo, monospace; font-variant-numeric: tabular-nums; }
  .g-cat:hover { color: var(--text); }
  .g-cat[aria-pressed="true"] { background: var(--panel-2); color: var(--text); }

  .g-main { min-width: 0; max-width: none; width: 100%; margin: 0; padding: 24px 0 96px; }
  .g-main.has-detail { padding-bottom: 344px; }
  .g-top { display: flex; align-items: center; gap: 16px; margin-bottom: 16px; }
  .g-search { flex: 1; display: flex; align-items: center; gap: 8px; height: 44px; padding: 0 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); color: var(--muted); transition: border-color .12s; }
  .g-search:focus-within { border-color: var(--muted); }
  .g-search input { flex: 1; min-width: 0; height: 100%; border: 0; outline: 0; background: none; color: var(--text); font: inherit; }
  .g-search input::-webkit-search-cancel-button { display: none; }
  .g-search kbd { padding: 0 6px; border: 1px solid var(--line); border-radius: 6px; font-size: 12px; line-height: 20px; }
  .g-count { color: var(--muted); font: 13px ui-monospace, "SF Mono", Menlo, monospace; font-variant-numeric: tabular-nums; white-space: nowrap; }

  .g-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(var(--tile, 64px), 1fr)); gap: 8px; }
  .g-tile { position: relative; aspect-ratio: 1; display: grid; place-items: center; padding: 0; border: 0; border-radius: 10px; background: var(--panel); color: var(--text); transition: background-color .12s; }
  .g-tile:hover { background: var(--panel-2); }
  /* Signature: the chosen icon sits in a selected inventory slot (corner brackets). */
  .g-tile[aria-current="true"] { background: var(--panel-2); }
  .g-tile[aria-current="true"]::after { content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none; --b: var(--accent); --l: 12px; --w: 2px;
    background:
      linear-gradient(var(--b) 0 0) top left / var(--l) var(--w), linear-gradient(var(--b) 0 0) top left / var(--w) var(--l),
      linear-gradient(var(--b) 0 0) top right / var(--l) var(--w), linear-gradient(var(--b) 0 0) top right / var(--w) var(--l),
      linear-gradient(var(--b) 0 0) bottom left / var(--l) var(--w), linear-gradient(var(--b) 0 0) bottom left / var(--w) var(--l),
      linear-gradient(var(--b) 0 0) bottom right / var(--l) var(--w), linear-gradient(var(--b) 0 0) bottom right / var(--w) var(--l);
    background-repeat: no-repeat; border-radius: 0; inset: 4px; }
  .g-empty { padding: 48px 0; color: var(--muted); }
  .g-empty p { margin: 0 0 12px; }
  .g-empty button { margin-right: 8px; padding: 4px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); font: 13px ui-monospace, "SF Mono", Menlo, monospace; }
  .g-empty button:hover { border-color: var(--muted); }

  /* Detail: a drawer under the grid, so browsing continues while it is open. */
  .g-detail { position: fixed; z-index: 8; left: 0; right: 0; bottom: 0; pointer-events: none; }
  .g-detail[hidden] { display: none; }
  .g-detail-in { max-width: 1440px; margin: 0 auto; padding: 0 clamp(16px, 3vw, 32px) 16px; display: grid; grid-template-columns: 232px minmax(0, 1fr); gap: 32px; }
  .g-card { grid-column: 2; pointer-events: auto; display: grid; grid-template-columns: 192px minmax(0, 1fr) minmax(0, 360px); gap: 24px; padding: 16px; border: 1px solid var(--line); border-radius: 16px; background: var(--panel); box-shadow: var(--shadow); animation: g-rise .16s ease-out; }
  @keyframes g-rise { from { opacity: 0; transform: translateY(8px); } }
  @media (prefers-reduced-motion: reduce) { .g-card { animation: none; } }
  .g-stage { display: grid; place-items: center; min-height: 192px; border-radius: 12px; color: var(--text); background-color: var(--code); background-image: radial-gradient(var(--grid-dot) 1px, transparent 1px); background-size: 16px 16px; }
  .g-info { min-width: 0; display: flex; flex-direction: column; gap: 12px; padding: 4px 0; }
  .g-name { display: flex; align-items: baseline; gap: 12px; }
  .g-name h2 { margin: 0; font: 600 22px/1.2 ui-monospace, "SF Mono", Menlo, monospace; letter-spacing: -.01em; }
  .g-name a { color: var(--muted); font-size: 13px; }
  .g-name a:hover { color: var(--text); }
  .g-desc { margin: 0; color: var(--muted); font-size: 14px; line-height: 1.5; }
  .g-words { margin: 0; display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 13px; color: var(--muted); max-height: 44px; overflow: hidden; }
  .g-words .alias { color: var(--text); font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 12px; }
  .g-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: auto; }
  .g-btn { display: inline-flex; align-items: center; height: 36px; padding: 0 12px; border: 1px solid var(--line); border-radius: 8px; background: none; color: var(--text); font-size: 13px; font-weight: 600; transition: border-color .12s, background-color .12s; }
  .g-btn:hover { border-color: var(--muted); }
  .g-btn.primary { border-color: var(--accent); background: var(--accent); color: var(--accent-ink); }
  .g-btn:active { transform: scale(.98); }
  .g-use { min-width: 0; display: flex; flex-direction: column; gap: 12px; padding: 4px 0; }
  .g-row { display: grid; grid-template-columns: repeat(11, minmax(0, 1fr)); gap: 2px; }
  .g-pick { aspect-ratio: 1; display: grid; place-items: center; padding: 0; border: 1px solid transparent; border-radius: 8px; background: none; color: var(--text); }
  .g-pick:hover { background: var(--panel-2); }
  .g-pick[aria-pressed="true"] { border-color: var(--line); background: var(--panel-2); }
  .g-pick svg { width: 24px; height: 24px; }
  .g-label { display: flex; justify-content: space-between; align-items: baseline; font-size: 13px; color: var(--muted); }
  .g-label b { color: var(--text); font-weight: 400; font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 12px; }
  .g-code { position: relative; margin-top: auto; border: 1px solid var(--line); border-radius: 10px; background: var(--code); }
  .g-tabs { display: flex; gap: 4px; padding: 4px 4px 0; }
  .g-tabs button { height: 28px; padding: 0 8px; border: 0; border-radius: 6px; background: none; color: var(--muted); font-size: 12px; font-weight: 600; }
  .g-tabs button[aria-selected="true"] { color: var(--text); background: var(--panel-2); }
  .g-tabs .g-copy { margin-left: auto; }
  .g-tabs .g-copy:hover { color: var(--text); }
  .g-code pre { margin: 0; padding: 8px 12px 12px; font-size: 12px; line-height: 1.6; min-height: 80px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .g-close { position: absolute; top: -12px; right: -12px; width: 28px; height: 28px; display: grid; place-items: center; padding: 0; border: 1px solid var(--line); border-radius: 50%; background: var(--panel); color: var(--muted); }
  .g-close:hover { color: var(--text); }
  .g-card { position: relative; }
  .toast { bottom: 24px; }

  @media (max-width: 1180px) {
    .g-card { grid-template-columns: 144px minmax(0, 1fr); }
    .g-stage { min-height: 144px; }
    .g-use { grid-column: 1 / -1; }
    .g-main.has-detail { padding-bottom: 480px; }
  }
  @media (max-width: 860px) {
    .g-shell { grid-template-columns: minmax(0, 1fr); gap: 0; }
    .g-side { position: static; max-height: none; overflow: visible; padding: 16px 0 0; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; }
    .g-group.cats { grid-column: 1 / -1; }
    .g-cats { display: flex; gap: 4px; margin: 0; overflow-x: auto; padding-bottom: 4px; }
    .g-cat { flex: none; gap: 8px; border: 1px solid var(--line); }
    .g-mats { grid-template-columns: repeat(auto-fill, 28px); }
    .g-main { padding: 16px 0 96px; }
    .g-detail-in { grid-template-columns: minmax(0, 1fr); padding-bottom: 8px; }
    .g-card { grid-column: 1; grid-template-columns: 96px minmax(0, 1fr); gap: 12px 16px; max-height: 72vh; overflow-y: auto; }
    .g-stage { min-height: 96px; }
    .g-stage svg { width: 64px; height: 64px; }
    .g-close { top: 8px; right: 8px; }
    .g-name { padding-right: 32px; flex-wrap: wrap; gap: 4px 12px; }
    .g-name h2 { font-size: 18px; }
    .g-actions { grid-column: 1 / -1; }
    .g-info { display: contents; }
    .g-stage { grid-row: span 2; align-self: start; }
    .g-info > .g-name, .g-info > .g-desc { grid-column: 2; }
    .g-info > .g-name { align-self: end; }
    .g-words { display: none; }
    .g-group.g-size { display: none; }
    .g-main.has-detail { padding-bottom: 440px; }
    .site-header nav { display: none; }
  }
</style>
</head>
<body>
<header class="site-header"><div class="bar">
  <a class="brand" href="../" aria-label="Playglyph 메인" data-i18n-attr="aria-label=brand.aria"><i data-pg="gamepad" data-style="sticker" data-size="26"></i> Playglyph</a>
  <nav aria-label="메인 메뉴" data-i18n-attr="aria-label=nav.aria">
    <a href="./" aria-current="page" data-i18n="nav.icons">아이콘</a>
    <a href="../docs/" data-i18n="nav.docs">문서</a>
  </nav>
  <div class="lang-switch" data-lang-switch></div>
  <a class="icon-link" href="https://github.com/FE4902/playglyph" aria-label="GitHub 저장소" data-i18n-attr="aria-label=nav.github" title="GitHub"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 .5a11.5 11.5 0 0 0-3.64 22.41c.58.1.79-.25.79-.56v-2c-3.2.7-3.88-1.37-3.88-1.37-.52-1.33-1.28-1.69-1.28-1.69-1.05-.71.08-.7.08-.7 1.15.08 1.76 1.19 1.76 1.19 1.03 1.76 2.7 1.25 3.36.96.1-.75.4-1.25.73-1.54-2.56-.29-5.25-1.28-5.25-5.68 0-1.26.45-2.28 1.19-3.09-.12-.29-.52-1.46.11-3.05 0 0 .97-.31 3.17 1.18a11 11 0 0 1 5.77 0c2.2-1.49 3.17-1.18 3.17-1.18.63 1.59.23 2.76.11 3.05.74.81 1.19 1.83 1.19 3.09 0 4.41-2.7 5.38-5.26 5.67.41.36.78 1.06.78 2.14v3.17c0 .31.21.67.8.56A11.5 11.5 0 0 0 12 .5Z"/></svg></a>
  <button id="theme" class="icon-link" type="button" aria-label="밝은 테마로 전환" title="밝은 테마로 전환"><svg class="i-sun" width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7.2 12a4.8 4.8 0 1 0 9.6 0a4.8 4.8 0 1 0 -9.6 0z"/><path d="M18.6 13.7L21.6 12L18.6 10.3z M15.46 17.87L18.79 18.79L17.87 15.46z M10.3 18.6L12 21.6L13.7 18.6z M6.13 15.46L5.21 18.79L8.54 17.87z M5.4 10.3L2.4 12L5.4 13.7z M8.54 6.13L5.21 5.21L6.13 8.54z M13.7 5.4L12 2.4L10.3 5.4z M17.87 8.54L18.79 5.21L15.46 6.13z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg><svg class="i-moon" width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M13.26 2.4A8.8 8.8 0 1 0 21.85 12.79A7 7 0 0 1 13.26 2.4z"/></svg></button>
</div></header>

<div class="g-shell">
  <aside class="g-side" aria-label="보기 설정" data-i18n-attr="aria-label=g.side">
    <div class="g-group">
      <h2 data-i18n="g.style">스타일</h2>
      <div class="seg" id="style" role="group" aria-label="스타일" data-i18n-attr="aria-label=g.style">
        <button type="button" data-v="sticker" aria-pressed="true" data-i18n="g.sticker">스티커</button>
        <button type="button" data-v="filled" aria-pressed="false" data-i18n="g.filled">단색</button>
      </div>
    </div>
    <div class="g-group">
      <h2><span data-i18n="g.material">재질</span> · <output id="matOut"></output></h2>
      <div class="g-mats" id="mats" role="group" aria-label="재질" data-i18n-attr="aria-label=g.material"></div>
    </div>
    <div class="g-group g-size">
      <h2><label for="size" data-i18n="g.size">크기</label> · <output id="sizeOut" for="size">32px</output></h2>
      <input class="g-range" id="size" type="range" min="16" max="64" step="8" value="32" />
    </div>
    <div class="g-group cats">
      <h2 data-i18n="g.categories">카테고리</h2>
      <div class="g-cats" id="cats"></div>
    </div>
  </aside>

  <main class="g-main" id="main">
    <div class="g-top">
      <label class="g-search">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L20 20"/></svg>
        <input id="q" type="search" autocomplete="off" spellcheck="false" placeholder="이름, 별칭, 한글로 찾기" aria-label="아이콘 찾기" data-i18n-attr="placeholder=g.searchPh, aria-label=g.searchAria" />
        <kbd aria-hidden="true">/</kbd>
      </label>
      <span class="g-count" id="count" role="status"></span>
    </div>
    <div class="g-grid" id="grid"></div>
    <div class="g-empty" id="empty" hidden></div>
  </main>
</div>

<div class="g-detail" id="detail" hidden>
  <div class="g-detail-in">
    <section class="g-card" aria-labelledby="dName">
      <div class="g-stage" id="dStage"></div>
      <div class="g-info">
        <div class="g-name"><h2 id="dName"></h2><a id="dCat" href="#"></a></div>
        <p class="g-desc" id="dDesc"></p>
        <p class="g-words" id="dWords"></p>
        <div class="g-actions">
          <button type="button" class="g-btn primary" data-copy="svg" data-i18n="g.copySvg">SVG 복사</button>
          <button type="button" class="g-btn" data-copy="name" data-i18n="g.copyName">이름 복사</button>
          <a class="g-btn" id="dFile" download data-i18n="g.download">SVG 파일</a>
        </div>
      </div>
      <div class="g-use">
        <div class="g-label"><span data-i18n="g.material">재질</span><b id="dMat"></b></div>
        <div class="g-row" id="dMats" role="group" aria-label="재질" data-i18n-attr="aria-label=g.material"></div>
        <div class="g-code">
          <div class="g-tabs" role="tablist" id="dTabs">
            <button type="button" role="tab" data-tab="html" aria-selected="true">HTML</button>
            <button type="button" role="tab" data-tab="js" aria-selected="false">JS</button>
            <button type="button" role="tab" data-tab="react" aria-selected="false">React</button>
            <button type="button" class="g-copy" data-copy="code" data-i18n="copy.button">복사</button>
          </div>
          <pre><code id="dCode"></code></pre>
        </div>
      </div>
      <button type="button" class="g-close" id="dClose" aria-label="닫기" data-i18n-attr="aria-label=g.close"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </section>
  </div>
</div>
<div class="toast" id="toast" role="status"></div>

<script type="module">
  import { icon, createIcons, suggest } from '../dist/lookup.js';
  import { materials } from '../dist/materials.js';

  const I = window.pgI18n;
  I.add({
    ko: {
      'g.count': '{n}종', 'g.countOf': '{n} / {all}종', 'g.default': '기본',
      'g.empty': '“{q}”에 맞는 아이콘이 없어요', 'g.tryThese': '비슷한 이름',
      'g.reactNote': 'React 컴포넌트는 단색 스타일만 있어요',
      'cat.all': '전체', 'cat.system': '시스템', 'cat.control': '진행 제어', 'cat.menu': '메뉴', 'cat.currency': '재화·보상',
      'cat.hud': '상태·HUD', 'cat.combat': '전투·행동', 'cat.social': '소셜', 'cat.input': '입력', 'cat.misc': '기타',
    },
    en: {
      'page.title': 'Icons — Playglyph',
      'page.description': 'Find any of the 134 Playglyph icons by name or alias and copy it as SVG or code.',
      'g.side': 'View settings', 'g.style': 'Style', 'g.sticker': 'Sticker', 'g.filled': 'Filled',
      'g.material': 'Material', 'g.size': 'Size', 'g.categories': 'Categories',
      'g.searchPh': 'Find by name or alias', 'g.searchAria': 'Find icons',
      'g.copySvg': 'Copy SVG', 'g.copyName': 'Copy name', 'g.download': 'SVG file', 'g.close': 'Close',
      'g.count': '{n} icons', 'g.countOf': '{n} of {all}', 'g.default': 'default',
      'g.empty': 'No icon matches “{q}”', 'g.tryThese': 'Close names',
      'g.reactNote': 'React components come in the filled style only',
      'cat.all': 'All', 'cat.system': 'System', 'cat.control': 'Flow control', 'cat.menu': 'Menu', 'cat.currency': 'Currency & rewards',
      'cat.hud': 'Status & HUD', 'cat.combat': 'Combat & actions', 'cat.social': 'Social', 'cat.input': 'Input', 'cat.misc': 'Misc',
    },
  });
  const t = I.t;
  I.apply();
  I.mountSwitch();
  createIcons();

  const $ = (id) => document.getElementById(id);
  const meta = await fetch('../dist/meta.json').then((r) => r.json());
  const byName = new Map(meta.map((m) => [m.name, m]));
  const CATS = ['all', 'system', 'control', 'menu', 'currency', 'hud', 'combat', 'social', 'input', 'misc'];
  const MATS = ['', ...Object.keys(materials)];
  const url = new URL(location.href);
  const state = {
    q: url.searchParams.get('q') ?? '',
    cat: CATS.includes(url.searchParams.get('cat')) ? url.searchParams.get('cat') : 'all',
    style: url.searchParams.get('style') === 'filled' ? 'filled' : 'sticker',
    material: MATS.includes(url.searchParams.get('material')) ? url.searchParams.get('material') : '',
    size: 32, current: byName.get(url.searchParams.get('icon')) ?? null, tab: 'html', list: [],
  };

  // Shareable address: ?icon=trophy&style=filled&material=gold&cat=hud&q=…
  function syncUrl() {
    const u = new URL(location.href);
    const put = (k, v, d = '') => (v && v !== d ? u.searchParams.set(k, v) : u.searchParams.delete(k));
    put('q', state.q.trim()); put('cat', state.cat, 'all'); put('style', state.style, 'sticker');
    put('material', state.material); put('icon', state.current?.name);
    history.replaceState(null, '', u);
  }

  const draw = (m, { size = state.size, material = state.material, style = state.style } = {}) =>
    icon(m.name, { style, size, ...(material ? { material } : {}) });

  // ---- sidebar ----
  for (const name of MATS) {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'g-mat' + (name ? '' : ' none'); b.dataset.m = name;
    b.title = name || t('g.default'); b.setAttribute('aria-label', b.title);
    const tones = name ? materials[name].tones : null;
    b.innerHTML = `<i${tones ? ` style="--c:${tones[2]};--o:${tones[0]}"` : ''}></i>`;
    $('mats').append(b);
  }
  const counts = meta.reduce((acc, m) => ((acc[m.category] = (acc[m.category] ?? 0) + 1), acc), {});
  for (const c of CATS) {
    if (c !== 'all' && !counts[c]) continue;
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'g-cat'; b.dataset.c = c;
    b.innerHTML = `${t('cat.' + c)}<span>${c === 'all' ? meta.length : counts[c]}</span>`;
    $('cats').append(b);
  }
  function paintControls() {
    for (const b of $('style').children) b.setAttribute('aria-pressed', b.dataset.v === state.style);
    for (const b of $('mats').children) b.setAttribute('aria-pressed', b.dataset.m === state.material);
    for (const b of $('cats').children) b.setAttribute('aria-pressed', b.dataset.c === state.cat);
    $('matOut').textContent = state.material || t('g.default');
    $('sizeOut').textContent = state.size + 'px';
  }

  // ---- grid ----
  const matches = (m, q) =>
    !q || m.name.includes(q) || m.aliases.some((a) => a.includes(q)) || m.tags.some((x) => x.includes(q)) || m.tagsKo.some((x) => x.includes(q)) || m.description.toLowerCase().includes(q);

  function renderGrid() {
    const q = state.q.trim().toLowerCase();
    state.list = meta.filter((m) => (state.cat === 'all' || m.category === state.cat) && matches(m, q));
    const n = state.list.length;
    $('count').textContent = n === meta.length ? t('g.count', { n }) : t('g.countOf', { n, all: meta.length });
    $('grid').style.setProperty('--tile', state.size + 32 + 'px');
    $('grid').replaceChildren(...state.list.map((m) => {
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'g-tile'; b.dataset.name = m.name;
      b.title = m.name; b.setAttribute('aria-label', `${m.name}: ${m.description}`);
      if (m === state.current) b.setAttribute('aria-current', 'true');
      b.innerHTML = draw(m);
      return b;
    }));
    $('empty').hidden = n > 0;
    if (!n) {
      const near = suggest(q, 5);
      $('empty').innerHTML = `<p>${t('g.empty', { q: state.q.trim().replace(/[<>&]/g, '') })}</p>` +
        (near.length ? `<p>${t('g.tryThese')}</p>` + near.map((s) => `<button type="button" data-try="${s}">${s}</button>`).join('') : '');
    }
  }

  // ---- detail drawer ----
  const esc = (s) => s.replace(/&/g, '&amp;').replace(/</g, '&lt;');
  function code(m) {
    const sticker = state.style === 'sticker', mat = state.material;
    if (state.tab === 'html') return `<i data-pg="${m.name}"${sticker ? ' data-style="sticker"' : ''}${mat ? ` data-material="${mat}"` : ''}></i>`;
    if (state.tab === 'react') return `import { ${m.export} } from 'playglyph/react';\n\n<${m.export} size={32} />\n// ${t('g.reactNote')}`;
    return sticker
      ? `import { ${m.export}, renderSticker } from 'playglyph/sticker';\n\nel.innerHTML = renderSticker(${m.export}, { size: 32${mat ? `, material: '${mat}'` : ''} });`
      : mat
        ? `import { icon } from 'playglyph/lookup';\n\nel.innerHTML = icon('${m.name}', { size: 32, material: '${mat}' });`
        : `import { ${m.export}, toSvg } from 'playglyph';\n\nel.innerHTML = toSvg(${m.export}, { size: 32 });`;
  }
  function renderDetail() {
    const m = state.current;
    $('detail').hidden = !m;
    $('main').classList.toggle('has-detail', !!m);
    for (const b of $('grid').children) b.toggleAttribute('aria-current', false);
    if (!m) return;
    const tile = $('grid').querySelector(`[data-name="${m.name}"]`);
    tile?.setAttribute('aria-current', 'true');
    $('dStage').innerHTML = draw(m, { size: 128 });
    $('dName').textContent = m.name;
    $('dCat').textContent = t('cat.' + m.category);
    $('dDesc').textContent = m.description;
    $('dWords').replaceChildren(
      ...m.aliases.map((a) => Object.assign(document.createElement('span'), { textContent: a, className: 'alias' })),
      ...(I.lang === 'ko' ? m.tagsKo : m.tags).map((x) => Object.assign(document.createElement('span'), { textContent: x })),
    );
    $('dMat').textContent = state.material || t('g.default');
    $('dMats').replaceChildren(...MATS.map((name) => {
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'g-pick'; b.dataset.m = name;
      b.title = name || t('g.default'); b.setAttribute('aria-label', b.title);
      b.setAttribute('aria-pressed', name === state.material);
      b.innerHTML = draw(m, { size: 24, material: name });
      return b;
    }));
    $('dFile').href = `../dist/svg/${state.style}/${state.style === 'sticker' && state.material ? state.material + '/' : ''}${m.name}.svg`;
    $('dFile').hidden = state.style === 'filled' && !!state.material; // no prebuilt file for a tinted filled icon
    for (const b of $('dTabs').querySelectorAll('[data-tab]')) b.setAttribute('aria-selected', b.dataset.tab === state.tab);
    $('dCode').innerHTML = esc(code(m));
  }
  function select(m, { focus = false } = {}) {
    state.current = m;
    renderDetail(); syncUrl();
    if (m) {
      const tile = $('grid').querySelector(`[data-name="${m.name}"]`);
      tile?.scrollIntoView({ block: 'nearest' });
      if (focus) tile?.focus({ preventScroll: true });
    }
  }
  function refresh() { paintControls(); renderGrid(); renderDetail(); syncUrl(); }

  // ---- events ----
  let toastTimer;
  function toast(msg) { const el = $('toast'); el.textContent = msg; el.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove('show'), 1400); }
  async function copy(text, name) {
    try { await navigator.clipboard.writeText(text); toast(name ? t('toast.copiedName', { name }) : t('toast.copied')); }
    catch { toast(t('toast.copyFailed')); }
  }
  $('grid').onclick = (e) => { const b = e.target.closest('.g-tile'); if (b) select(byName.get(b.dataset.name) === state.current ? null : byName.get(b.dataset.name)); };
  $('empty').onclick = (e) => { const s = e.target.dataset?.try; if (s) { $('q').value = state.q = s; refresh(); } };
  $('q').value = state.q;
  $('q').oninput = (e) => { state.q = e.target.value; renderGrid(); syncUrl(); };
  $('style').onclick = (e) => { const v = e.target.closest('button')?.dataset.v; if (v) { state.style = v; refresh(); } };
  const pickMaterial = (e) => { const b = e.target.closest('button[data-m]'); if (b) { state.material = b.dataset.m; refresh(); } };
  $('mats').onclick = pickMaterial;
  $('dMats').onclick = pickMaterial;
  $('cats').onclick = (e) => { const b = e.target.closest('button'); if (b) { state.cat = b.dataset.c; refresh(); } };
  $('dCat').onclick = (e) => { e.preventDefault(); state.cat = state.current.category; state.q = $('q').value = ''; refresh(); };
  $('size').oninput = (e) => { state.size = +e.target.value; paintControls(); renderGrid(); };
  $('dTabs').onclick = (e) => { const tab = e.target.closest('[data-tab]')?.dataset.tab; if (tab) { state.tab = tab; renderDetail(); } };
  $('dClose').onclick = () => select(null);
  document.querySelectorAll('[data-copy]').forEach((b) => (b.onclick = () => {
    const m = state.current, kind = b.dataset.copy;
    if (kind === 'svg') copy(draw(m, { size: 24 }), m.name + '.svg');
    else if (kind === 'name') copy(m.name, m.name);
    else copy(code(m));
  }));
  document.addEventListener('keydown', (e) => {
    const typing = document.activeElement === $('q');
    if (e.key === '/' && !typing) { e.preventDefault(); $('q').focus(); return; }
    if (e.key === 'Escape') { if (state.current) select(null); else if (typing) $('q').blur(); return; }
    // Arrow keys walk the grid once an icon is chosen.
    if (typing || !state.current || !e.key.startsWith('Arrow') || e.target.matches?.('input, select')) return;
    const i = state.list.indexOf(state.current); if (i < 0) return;
    const cols = getComputedStyle($('grid')).gridTemplateColumns.split(' ').length;
    const j = i + ({ ArrowLeft: -1, ArrowRight: 1, ArrowUp: -cols, ArrowDown: cols })[e.key];
    if (j >= 0 && j < state.list.length) { e.preventDefault(); select(state.list[j], { focus: true }); }
  });

  const themeBtn = $('theme');
  const paintTheme = () => { const label = t(document.documentElement.dataset.theme === 'light' ? 'theme.toDark' : 'theme.toLight'); themeBtn.title = label; themeBtn.setAttribute('aria-label', label); };
  themeBtn.onclick = () => {
    const next = document.documentElement.dataset.theme === 'light' ? 'dark' : 'light';
    document.documentElement.dataset.theme = next;
    try { localStorage.setItem('pg-theme', next); } catch {}
    paintTheme();
  };
  paintTheme();
  refresh();
  if (state.current) $('grid').querySelector('[aria-current]')?.scrollIntoView({ block: 'center' });
</script>
</body>
</html>
