<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Playglyph single-file example</title>
<!-- In a real game: <script src="https://cdn.jsdelivr.net/npm/playglyph/dist/playglyph.js"></script> -->
<script src="../dist/playglyph.js"></script>
<style>
  body { margin: 0; background: #14161d; color: #e7e9f0; font: 14px system-ui, sans-serif; }
  .hud { display: flex; gap: 16px; align-items: center; padding: 12px 16px; background: #1d2030; }
  .hud .spacer { flex: 1; }
  .hud button { background: none; border: 0; color: inherit; padding: 4px; cursor: pointer; }
  .stat { display: flex; align-items: center; gap: 6px; font-weight: 700; }
  canvas { display: block; margin: 16px; background: #0b0c10; }
</style>
</head>
<body>
  <!-- HUD built only from <i data-pg> tags: replaced on load, no build step -->
  <div class="hud">
    <span class="stat"><i data-pg="heart" data-style="sticker" data-size="28"></i> 3</span>
    <span class="stat"><i data-pg="coin" data-style="color" data-size="28"></i> 1,250</span>
    <span class="spacer"></span>
    <button aria-label="Music"><i data-pg="bgm" data-style="sticker" data-size="28"></i></button>
    <button aria-label="Sound"><i data-pg="sound" data-style="sticker" data-border="#fff" data-size="28"></i></button>
    <button aria-label="Settings"><i data-pg="Gear" data-size="24"></i></button>
    <button aria-label="Pause"><i data-pg="pause_icon" data-size="24"></i></button>
    <!-- not redrawn yet: falls back to filled (or line) in the material color, never breaks -->
    <button aria-label="Inventory"><i data-pg="inventory" data-style="sticker" data-material="gold" data-size="24"></i></button>
    <!-- a typo on purpose: renders a "?" placeholder and logs a suggestion instead of breaking -->
    <button aria-label="Typo"><i data-pg="setting" data-size="24"></i></button>
  </div>

  <!-- Canvas game: rasterize stickers once at load, then draw the images every frame -->
  <canvas id="game" width="520" height="150"></canvas>
  <script>
    const ctx = document.getElementById('game').getContext('2d');
    const mats = ['gold', 'silver', 'bronze', 'lava', 'arcane'];
    Promise.all([
      ...mats.map((m) => playglyph.stickerToImage(playglyph.getIcon('coin', 'sticker'), { material: m, size: 96 })),
      playglyph.stickerToImage(playglyph.getIcon('hp', 'sticker'), { size: 64 }),
      playglyph.stickerToImage(playglyph.getIcon('hp', 'sticker'), { size: 64, state: 'disabled' }),
    ]).then((imgs) => {
      const coins = imgs.slice(0, 5), [heart, heartOff] = imgs.slice(5);
      let t = 0;
      (function frame() {
        ctx.clearRect(0, 0, 520, 150);
        coins.forEach((img, i) => ctx.drawImage(img, 20 + i * 100, 16 + Math.sin(t / 20 + i) * 6, 64, 64));
        [heart, heart, heartOff].forEach((img, i) => ctx.drawImage(img, 20 + i * 40, 104, 32, 32));
        t++;
        requestAnimationFrame(frame);
      })();
    });
  </script>
</body>
</html>
